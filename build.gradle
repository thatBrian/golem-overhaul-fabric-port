plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

// A release tag (v1.1.1-26.1.x-0.1.0-fabric-unofficial) overrides the version in gradle.properties.
def releaseVersion = System.getenv('GITHUB_TAG')?.replaceFirst(/^v/, '') ?: mod_version
group = maven_group
version = releaseVersion

base {
    archivesName = "${mod_id}-fabric"
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.toVersion(java_version)
    targetCompatibility = JavaVersion.toVersion(java_version)
}

// Upstream is an Architectury multiloader project. This port keeps its common/ and fabric/ source
// trees intact (so diffs against upstream stay readable) but compiles them as one Fabric module.
sourceSets {
    main {
        java {
            srcDirs = ['common/src/main/java', 'fabric/src/main/java']
        }
        resources {
            srcDirs = ['common/src/main/resources', 'common/src/generated/resources', 'fabric/src/main/resources']
            exclude '.cache'
        }
    }
}

repositories {
    maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
    maven { name = 'Architectury'; url = 'https://maven.architectury.dev/' }
    maven { name = 'Team Resourceful'; url = 'https://maven.teamresourceful.com/repository/maven-public/' }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    mavenCentral()
}

dependencies {
    // Minecraft 26.x ships unobfuscated, so no mappings are declared (Loom rejects them).
    minecraft "com.mojang:minecraft:${minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    implementation "dev.architectury:architectury-fabric:${architectury_api_version}"
    implementation "com.teamresourceful.resourcefullib:resourcefullib-fabric-26.1:${resourcefullib_version}"
    implementation "com.teamresourceful.resourcefulconfig:resourcefulconfig-fabric-26.1:${resourcefulconfig_version}"
    implementation "maven.modrinth:geckolib:${geckolib_modrinth_version_id}"

    // MixinExtras: bundled by Fabric Loader at runtime; needed at compile time for @WrapOperation/@Local.
    compileOnly "io.github.llamalad7:mixinextras-fabric:${mixinextras_version}"
    annotationProcessor "io.github.llamalad7:mixinextras-fabric:${mixinextras_version}"

}

tasks.named('processResources', ProcessResources).configure {
    def props = [
            mod_id                     : mod_id,
            mod_name                   : mod_name,
            mod_version                : project.version,
            minecraft_version          : minecraft_version,
            minecraft_version_range    : minecraft_version_range,
            java_version               : java_version,
            fabric_loader_version_range: fabric_loader_version_range,
            fabric_api_version_range   : fabric_api_version_range,
            architectury_api_version   : architectury_api_version,
            resourcefullib_version     : resourcefullib_version,
            resourcefulconfig_version  : resourcefulconfig_version,
            geckolib_version           : geckolib_version,
    ]
    inputs.properties props
    filesMatching('fabric.mod.json') {
        expand props
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = java_version.toInteger()
}

jar {
    from('README.md') { rename { 'README_golemoverhaul.md' } }
}
